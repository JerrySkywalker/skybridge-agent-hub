name: Jerry CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gate:
        description: Gate to run
        required: true
        default: ci-local
        type: choice
        options:
          - ci-local
          - release-gate-local

permissions:
  contents: read

jobs:
  ci:
    name: Local validation
    runs-on: [self-hosted, Windows, X64, jerry-ci, jerry-ci-win, p1, skybridge]
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Add Git to PATH
        run: |
          $gitDirs = @(
            "$env:ProgramFiles\Git\cmd",
            "$env:ProgramFiles\Git\bin",
            "${env:ProgramFiles(x86)}\Git\cmd",
            "${env:ProgramFiles(x86)}\Git\bin",
            "$env:ProgramFiles\Microsoft Visual Studio\2022\BuildTools\Common7\IDE\CommonExtensions\Microsoft\TeamFoundation\Team Explorer\Git\cmd",
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\TeamFoundation\Team Explorer\Git\cmd",
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\TeamFoundation\Team Explorer\Git\cmd",
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Professional\Common7\IDE\CommonExtensions\Microsoft\TeamFoundation\Team Explorer\Git\cmd"
          )
          foreach ($dir in $gitDirs) {
            if ($dir -and (Test-Path -LiteralPath (Join-Path $dir "git.exe"))) {
              $env:PATH = "$dir;$env:PATH"
              Add-Content -Path $env:GITHUB_PATH -Value $dir
              git --version
              exit 0
            }
          }
          Write-Host "git_path_bootstrap=false"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Show toolchain
        run: |
          if (Get-Command git -ErrorAction SilentlyContinue) { git --version } else { Write-Host "git_available=false" }
          node --version
          npm --version
          corepack --version
          corepack pnpm --version
          pwsh --version

      - name: Install dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile=false

      - name: Run selected gate
        run: |
          $gate = "${{ github.event.inputs.gate }}"
          if ([string]::IsNullOrWhiteSpace($gate)) {
            $gate = "ci-local"
          }

          if ($gate -eq "ci-local") {
            npm run ci:local
          } elseif ($gate -eq "release-gate-local") {
            npm run release:gate:local
          } else {
            throw "Unknown gate: $gate"
          }
